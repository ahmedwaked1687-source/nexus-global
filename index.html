<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-label="To-do list application">
        <header class="header">
          <div>
            <p class="eyebrow">Daily Planner</p>
            <h1>To-Do List</h1>
          </div>
          <span id="task-count" class="task-count">0 tasks left</span>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task..."
            aria-label="Add a task"
            maxlength="120"
            required
          />
          <button type="submit" class="primary-btn">Add</button>
        </form>

        <div class="toolbar" aria-label="Task filters">
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
          <button id="clear-completed" class="secondary-btn" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
